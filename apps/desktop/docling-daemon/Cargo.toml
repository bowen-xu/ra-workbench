[package]
name = "research-docling-daemon"
version = "0.1.0"
edition = "2024"

[dependencies]
research-docling-runtime = { path = "../../../packages/docling-runtime" }
docling-pdf = "=2.45.7"
ort = { version = "=2.0.0-rc.15", default-features = false, features = ["std", "download-binaries", "tls-rustls"] }
axum = { version = "0.8", features = ["ws"] }
base64 = "0.22"
serde_json = "1"
tokio = { version = "1", features = ["macros", "rt-multi-thread", "net", "signal", "time", "sync"] }
uuid = { version = "1", features = ["v4"] }
tempfile = "3"
fs2 = "0.4"

[target.'cfg(target_os = "macos")'.dependencies]
tao = { version = "=0.35.3", default-features = false }
tray-icon = { version = "=0.24.2", default-features = false }
rfd = { version = "=0.16.0", default-features = false }
image = { version = "=0.25.10", default-features = false, features = ["png"] }

[patch.crates-io]
docling-pdf = { path = "vendor/docling-pdf" }
docling-core = { path = "vendor/docling-core" }

[profile.release]
lto = "thin"

[dev-dependencies]
docling-core = "=2.45.7"
tower = { version = "0.5", features = ["util"] }
tokio-tungstenite = "0.29"
futures-util = "0.3"
reqwest = { version = "0.12", default-features = false, features = ["json", "rustls-tls"] }
