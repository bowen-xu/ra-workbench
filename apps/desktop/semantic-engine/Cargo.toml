[package]
name = "research-semantic-engine"
version = "0.1.0"
edition = "2024"

[lib]
crate-type = ["cdylib"]

[dependencies]
arrow-array = "58.0.0"
arrow-schema = "58.0.0"
futures-util = "0.3"
lancedb = { version = "=0.31.0", default-features = false }
research-semantic-engine-api = { path = "../../../packages/semantic-engine-api" }
serde = "1"
serde_json = "1"
thiserror = "2"
tokio = { version = "1", features = ["full"] }

[dev-dependencies]
tempfile = "3"

[profile.release]
codegen-units = 1
lto = true
opt-level = "s"
strip = true
