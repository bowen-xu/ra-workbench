[package]
name = "research-assistant"
version = "0.8.0"
description = "A local-first, traceable research workspace"
authors = ["Research Assistant contributors"]
edition = "2024"
default-run = "research-assistant"
autobins = false

[lib]
name = "research_assistant_lib"
crate-type = ["rlib"]

[[bin]]
name = "research-assistant"
path = "src/main.rs"

[[bin]]
name = "ai-calibration"
path = "src/bin/ai_calibration.rs"
required-features = ["development-data"]

[[bin]]
name = "note-pdf-worker"
path = "src/bin/note-pdf-worker.rs"

[[bin]]
name = "workbench-composition-check"
path = "src/bin/workbench-composition-check.rs"
required-features = ["development-data"]

[[bin]]
name = "native-preview-check"
path = "src/bin/native-preview-check.rs"
required-features = ["development-data"]

[[bin]]
name = "literature-catalog-check"
path = "src/bin/literature-catalog-check.rs"
required-features = ["development-data"]

[features]
default = []
development-data = ["rusqlite/hooks"]

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
biblatex = "=0.12.0"
nix = { version = "0.30", features = ["dir", "fs", "process", "signal"] }
base64 = "0.22"
percent-encoding = "2"
quick-xml = { version = "0.41", features = ["serialize"] }
pulldown-cmark = { version = "=0.13.4", default-features = false }
regex = "1"
rusqlite = { version = "0.37", features = ["backup", "bundled", "functions"] }
futures-util = "0.3"
http-body-util = "0.1"
hyper = { version = "1", features = ["http1", "server"] }
hyper-util = { version = "0.1", features = ["tokio"] }
fs2 = "0.4"
libloading = "0.8"
research-docling-runtime = { path = "../../../packages/docling-runtime" }
research-semantic-engine-api = { path = "../../../.dependencies/sdk/native/semantic-engine-api" }
research-agent-core = { path = "../../../packages/agent-core" }
research-data-runtime = { path = "../../../packages/data-runtime" }
research-note-query = { path = "../../../.dependencies/sdk/native/note-query" }
research-workbench-native-sdk = { path = "../../../.dependencies/sdk/native/workbench-native-sdk" }
time = { version = "=0.3.47", default-features = false, features = ["parsing"] }
reqwest = { version = "0.12", default-features = false, features = ["json", "rustls-tls", "stream"] }
scraper = { version = "0.27", default-features = false }
serde = { version = "1", features = ["derive"] }
serde_json = { version = "1", features = ["unbounded_depth"] }
serde-saphyr = { version = "=1.2.0", default-features = false, features = ["deserialize"] }
sha2 = "0.10"
subtle = "2"
tauri = { version = "2", features = [] }
tauri-plugin-dialog = "2"
tauri-plugin-clipboard-manager = "=2.3.2"
tauri-plugin-opener = "2"
tauri-plugin-process = "2"
tauri-plugin-updater = "2"
thiserror = "2"
tokio = { version = "1", features = ["fs", "io-util", "macros", "net", "process", "sync", "time"] }
tokio-tungstenite = "0.28"
toml = { version = "=1.1.4", default-features = false, features = ["parse", "serde", "std"] }
toml_edit = "=0.25.13"
uuid = { version = "1", features = ["v4", "v5", "v7"] }
zip = { version = "=4.6.1", default-features = false, features = ["deflate"] }
tempfile = "3"

[target.'cfg(target_os = "macos")'.dependencies]
objc2 = "=0.6.4"
objc2-app-kit = { version = "=0.3.2", default-features = false, features = ["std", "NSApplication", "NSPrintInfo", "NSPrintOperation", "NSWindow", "NSView"] }
objc2-foundation = { version = "=0.3.2", features = ["NSDate", "NSRunLoop", "NSURL", "NSDictionary", "NSError", "NSGeometry", "NSProcessInfo"] }
objc2-web-kit = { version = "=0.3.2", default-features = false, features = ["std", "WKWebView", "WKWebViewConfiguration", "WKWebsiteDataStore", "WKNavigation", "WKContentWorld", "WKFrameInfo", "block2", "objc2-app-kit", "objc2-core-foundation"] }
block2 = "=0.6.2"

[dev-dependencies]
research-writing-projects-native = { path = "../../../.dependencies/test-plugins/writing_projects/native" }
research-literature-library-native = { path = "../../../.dependencies/test-plugins/literature_library/native" }
rusqlite = { version = "0.37", features = ["hooks"] }
tokio = { version = "1", features = ["test-util"] }

[profile.release]
codegen-units = 1
lto = true
opt-level = "s"
panic = "abort"
strip = true
