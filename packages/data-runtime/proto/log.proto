syntax = "proto3";
package research.data_runtime;

// The payload belongs to the coordinator's versioned mutation codec. The log
// adapter validates only this envelope and never interprets business bytes.
message LogEnvelope {
  uint32 schema_version = 1;
  bytes store_epoch = 2;
  uint64 position = 3;
  bytes payload = 4;
}

// Written atomically with entries or maintenance commands. A nonempty synced
// state batch is also the device barrier required by published raft-engine 0.4.2.
message LogState {
  uint32 schema_version = 1;
  bytes store_epoch = 2;
  uint64 accepted_position = 3;
  uint64 synced_position = 4;
  uint64 compacted_position = 5;
}
