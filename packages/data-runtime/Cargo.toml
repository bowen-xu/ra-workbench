[package]
name = "research-data-runtime"
version = "0.1.0"
edition = "2024"
license = "Apache-2.0"
description = "Owned local log and SQL materialization runtime"

[dependencies]
protobuf = "=2.28.0"
raft-engine = { version = "=0.4.2", default-features = false }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
sha2 = "0.10"
thiserror = "2"
uuid = { version = "1", features = ["serde", "v4", "v5"] }

[build-dependencies]
protobuf-codegen-pure = "=2.28.0"

[dev-dependencies]
tempfile = "3"
